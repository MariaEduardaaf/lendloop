# Local automation stack for LendLoop: n8n + Mailpit (fake SMTP inbox).
# Start: docker compose up -d     n8n UI: http://localhost:5678     Mailpit UI: http://localhost:8025
services:
  n8n:
    # n8n 2.x (stable channel at the time of writing). Pinned to an exact tag on purpose.
    image: n8nio/n8n:2.48.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Secrets and settings come from .env (gitignored). Workflows read them via $env.
      CONVEX_TO_N8N_SECRET: ${CONVEX_TO_N8N_SECRET:?set it in .env}
      N8N_TO_CONVEX_SECRET: ${N8N_TO_CONVEX_SECRET:?set it in .env}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:?set it in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set it in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      TZ: ${GENERIC_TIMEZONE:-Europe/Madrid}
      # n8n 2.x blocks $env in expressions and Code nodes by default. We need it for the HMAC secrets.
      # This container only holds the variables listed here, so exposing them to workflows is acceptable locally.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # n8n 2.x blocks require() of Node built-ins in Code nodes by default. HMAC needs only crypto.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Localhost over plain HTTP: the secure cookie flag would lock you out of the UI.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Keep execution history for failed and successful runs (demo and debugging), prune after 14 days.
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    extra_hosts:
      # Lets n8n reach the Convex local backend running on the host (also needed on Colima/Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mailpit:
        condition: service_started
      n8n-import:
        condition: service_completed_successfully

  # One-shot job: loads the workflows and the Mailpit credential from ./n8n into the n8n database, publishes
  # (activates) the three workflows by id, then exits.
  # It runs on every `docker compose up`, so the files in ./n8n are the source of truth (edits made in the
  # n8n UI are overwritten unless you export them back into ./n8n).
  n8n-import:
    image: n8nio/n8n:2.48.4
    entrypoint: /bin/sh
    command:
      - -c
      - >
        n8n import:credentials --input=/import/credentials/mailpit-smtp.json &&
        n8n import:workflow --separate --input=/import/workflows &&
        n8n publish:workflow --id=lendloopErrHandler1 &&
        n8n publish:workflow --id=lendloopNotify001 &&
        n8n publish:workflow --id=lendloopOverdue001
    environment:
      # Must be the same key the n8n service uses, otherwise it cannot read the imported credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set it in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI and API
      - "127.0.0.1:1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  n8n_data:
